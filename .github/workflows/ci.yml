name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm ci
      - run: npm run test
      - run: npm run build
        env:
          POLLINATIONS_TOKEN: ${{ secrets.POLLINATIONS_TOKEN || 'test' }}
      - run: test -f dist/index.js
      - run: |
          if ! git diff --quiet dist/; then
            echo "ERROR: dist/ is out of sync with src/ — run npm run build and commit dist/index.js"
            exit 1
          fi
